name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees" -f "assignees[]=iamthe-nerdyDev" > /dev/null
